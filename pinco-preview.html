<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b0004">
  <title>PINCO — Tasodifiy tanlov</title>
  <meta name="description" content="PINCO ishtirokchilari uchun halol tasodifiy tanlov.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg-0: #170003;
  --bg-1: #3a0008;
  --panel: rgba(58, 4, 10, .50);
  --panel-2: rgba(24, 0, 3, .55);
  --field: rgba(14, 0, 2, .65);

  --gold: #f0b93a;
  --gold-soft: #ffe29a;
  --gold-line: rgba(240, 185, 58, .38);

  --crimson: #ff2b12;
  --crimson-deep: #7c0000;

  --teal: #2fe6b8;
  --teal-soft: rgba(47, 230, 184, .18);

  --ink: #fff6ec;
  --muted: rgba(255, 246, 236, .58);
  --danger: #ff6d6d;

  --r-lg: 22px;
  --r-md: 14px;

  --display: "Unbounded", "Inter", sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; }

html { color-scheme: dark; scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--body);
  background:
    radial-gradient(circle at 84% 8%, rgba(255, 60, 20, .30), transparent 32%),
    radial-gradient(circle at 6% 96%, rgba(120, 0, 0, .40), transparent 38%),
    linear-gradient(160deg, #12000a 0%, var(--bg-1) 46%, #5c0009 78%, #1a0002 100%);
  overflow-x: hidden;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- SIGNATURE BACKGROUND: target + dart ---------- */
.fx {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.fx-target {
  position: absolute;
  top: 50%;
  right: -6vw;
  width: 62vw;
  max-width: 900px;
  aspect-ratio: 1;
  transform: translateY(-50%);
  border-radius: 50%;
  opacity: .16;
  background:
    radial-gradient(circle, transparent 0 13%, var(--crimson) 13% 15.5%, transparent 15.5% 30%,
      var(--gold) 30% 32.5%, transparent 32.5% 47%, var(--crimson) 47% 49.5%,
      transparent 49.5% 64%, var(--gold) 64% 66.5%, transparent 66.5% 81%,
      var(--crimson) 81% 83.5%, transparent 83.5%);
  filter: blur(.4px);
}

.fx-dart {
  position: absolute;
  top: 38%;
  right: 22%;
  width: 210px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--teal) 55%, var(--teal));
  border-radius: 3px;
  transform-origin: right center;
  opacity: 0;
  animation: dartFly 2.4s .3s ease-out 1;
}

.fx-dart::after {
  content: "";
  position: absolute;
  right: -2px;
  top: 50%;
  width: 0; height: 0;
  transform: translateY(-50%);
  border-style: solid;
  border-width: 6px 0 6px 11px;
  border-color: transparent transparent transparent var(--teal);
}

@keyframes dartFly {
  0% { opacity: 0; transform: rotate(-18deg) scaleX(0); }
  18% { opacity: 1; }
  55% { opacity: 1; transform: rotate(0deg) scaleX(1); }
  100% { opacity: 0; transform: rotate(0deg) scaleX(1); }
}

.fx-glow {
  position: absolute;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  filter: blur(120px);
}

.fx-glow-a { top: -220px; right: 2%; background: rgba(255, 30, 10, .22); }
.fx-glow-b { bottom: -260px; left: -140px; background: rgba(240, 185, 58, .10); }

/* ---------- LAYOUT ---------- */
.shell {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 34px 0 40px;
  position: relative;
  z-index: 1;
}

.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 4px 4px 28px;
}

.logo {
  display: block;
  width: 176px;
  height: auto;
  filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .35));
}

.top-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.lang-switch {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(30, 0, 4, .45);
}

.lang-btn {
  padding: 8px 14px;
  border: 0;
  border-left: 1px solid var(--gold-line);
  background: transparent;
  color: var(--muted);
  font-family: var(--display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .05em;
  transition: color .15s ease, background .15s ease;
}

.lang-btn:first-child { border-left: 0; }

.lang-btn:hover:not(.active) { color: var(--gold-soft); }

.lang-btn.active {
  color: #2a0700;
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
}

.local-tag {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 15px;
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  background: rgba(30, 0, 4, .45);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  white-space: nowrap;
}

.local-tag i {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 10px rgba(47, 230, 184, .9);
}

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
  align-items: start;
  gap: 16px;
}

/* ---------- PANELS ---------- */
.panel {
  position: relative;
  border: 1px solid var(--gold-line);
  border-radius: var(--r-lg);
  background: linear-gradient(175deg, var(--panel), var(--panel-2));
  backdrop-filter: blur(18px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 220, 150, .06);
  padding: 28px;
}

.panel-ids { padding-bottom: 20px; }

.panel-run {
  display: flex;
  flex-direction: column;
}

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  min-height: 24px;
  margin-bottom: 20px;
}

.panel-head h1,
.panel-head h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.count {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--muted);
}

.count strong { color: var(--ink); font-size: 15px; }

/* TEXTAREA */
#idsInput {
  width: 100%;
  min-height: 380px;
  resize: vertical;
  padding: 20px 22px;
  border: 1px solid rgba(220, 90, 20, .45);
  border-radius: var(--r-md);
  outline: none;
  background: linear-gradient(180deg, rgba(12, 0, 2, .82), rgba(24, 0, 2, .70));
  color: var(--ink);
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .015em;
  line-height: 1.75;
  box-shadow: inset 0 8px 34px rgba(0, 0, 0, .25);
  transition: border-color .18s ease, box-shadow .18s ease;
}

#idsInput:focus {
  border-color: var(--gold);
  box-shadow: inset 0 8px 34px rgba(0, 0, 0, .22), 0 0 0 3px rgba(240, 185, 58, .10);
}

#idsInput::placeholder { color: rgba(255, 255, 255, .32); font-weight: 500; }

.ids-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
}

.text-btn {
  border: 0;
  background: transparent;
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .02em;
  padding: 6px 2px;
}

.text-btn:hover { color: var(--gold-soft); }

.text-btn-fill {
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  padding: 10px 18px;
  background: rgba(30, 0, 4, .4);
}

.hash-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(207, 76, 0, .45);
  border-radius: 999px;
  padding: 7px 8px 7px 14px;
  background: rgba(30, 0, 4, .45);
}

.hash-chip span {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .07em;
  color: var(--gold);
}

.hash-chip code {
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(255, 255, 255, .8);
  background: rgba(0, 0, 0, .3);
  padding: 4px 9px;
  border-radius: 999px;
}

/* STEPPER */
.stepper {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) 56px;
  gap: 10px;
  margin-bottom: 16px;
}

.stepper button,
.stepper input {
  height: 58px;
  border: 1px solid rgba(187, 51, 0, .55);
  color: var(--ink);
  background: linear-gradient(180deg, rgba(38, 0, 0, .85), rgba(18, 0, 0, .9));
  border-radius: var(--r-md);
}

.stepper button {
  font-size: 24px;
  font-weight: 600;
  transition: border-color .18s ease, transform .12s ease;
}

.stepper button:hover { border-color: var(--gold); }
.stepper button:active { transform: translateY(1px); }

.stepper input {
  min-width: 0;
  text-align: center;
  outline: none;
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  appearance: textfield;
}

.stepper input::-webkit-inner-spin-button,
.stepper input::-webkit-outer-spin-button { display: none; }

.stepper input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(240, 185, 58, .10);
}

/* EXCLUDE INFO (auto — winners are always removed from the pool) */
.exclude-info {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 16px;
  padding: 8px 14px;
  border: 1px solid var(--teal-soft);
  border-radius: 999px;
  background: rgba(47, 230, 184, .06);
  font-size: 11.5px;
  color: var(--teal);
}

.exclude-info i {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px rgba(47, 230, 184, .9);
}

.exclude-info strong { color: var(--gold-soft); }

.validation {
  min-height: 20px;
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.validation.ok { color: var(--teal); }
.validation.error { color: var(--danger); }

/* START */
.start {
  position: relative;
  margin-top: auto;
  width: 100%;
  min-height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--gold-soft);
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(circle at 78% 12%, rgba(255, 255, 255, .16), transparent 26%),
    linear-gradient(180deg, var(--crimson) 0%, var(--crimson-deep) 100%);
  box-shadow:
    0 0 26px rgba(255, 40, 10, .28),
    inset 0 1px 0 rgba(255, 255, 255, .22);
  transition: transform .15s ease, box-shadow .18s ease, filter .18s ease;
}

.start-ring {
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px dashed rgba(255, 255, 255, .18);
  right: -40px;
  top: -40px;
}

.start-label {
  position: relative;
  font-family: var(--display);
  font-size: 26px;
  font-weight: 900;
  letter-spacing: .1em;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .3);
}

.start:not(:disabled):hover {
  transform: translateY(-2px);
  filter: brightness(1.07);
  box-shadow: 0 0 40px rgba(255, 64, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .24);
}

.start:not(:disabled):active { transform: translateY(0); }

/* ---------- DRAW STAGE ---------- */
.stage {
  margin-top: 16px;
  padding: 30px;
  border: 1px solid var(--gold-line);
  border-radius: var(--r-lg);
  background: linear-gradient(175deg, var(--panel), var(--panel-2));
  backdrop-filter: blur(18px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  text-align: center;
}

.stage-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  background: rgba(30, 0, 4, .5);
  color: var(--gold-soft);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.stage-badge i {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--crimson);
  box-shadow: 0 0 12px rgba(255, 40, 10, .9);
  animation: livePulse 1s ease-in-out infinite;
}

.roulette {
  min-height: 220px;
  display: grid;
  place-items: center;
  gap: 10px;
  border: 1px solid rgba(240, 185, 58, .4);
  border-radius: 18px;
  background:
    radial-gradient(circle at center, rgba(255, 60, 0, .14), transparent 45%),
    linear-gradient(180deg, rgba(15, 0, 0, .9), rgba(35, 0, 0, .9));
  transition: box-shadow .4s ease;
}

.stage.hit .roulette {
  box-shadow: 0 0 0 3px var(--teal-soft), 0 0 40px rgba(47, 230, 184, .35);
}

.roulette strong {
  font-family: var(--mono);
  font-size: clamp(42px, 7.5vw, 76px);
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--ink);
  text-shadow: 0 0 26px rgba(255, 49, 0, .35);
}

#rouletteProgress {
  color: var(--muted);
  font-size: 12px;
  font-family: var(--mono);
}

/* ---------- RESULTS (centered overlay) ---------- */
.results {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(circle at 50% 42%, rgba(90, 10, 10, .55), transparent 55%),
    rgba(6, 0, 1, .86);
  backdrop-filter: blur(6px);
  animation: overlayIn .25s ease both;
}

@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.confetti-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.confetti-piece {
  position: absolute;
  top: -30px;
  width: 10px;
  height: 16px;
  opacity: .95;
  animation-name: confettiFall;
  animation-timing-function: cubic-bezier(.25, .46, .45, .94);
  animation-fill-mode: forwards;
  will-change: transform, opacity;
}

@keyframes confettiFall {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translate(var(--drift, 40px), 118vh) rotate(620deg); opacity: 0; }
}

.results-panel {
  position: relative;
  z-index: 1;
  width: min(720px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  padding: 30px;
  border: 1px solid var(--gold-line);
  border-radius: var(--r-lg);
  background: linear-gradient(175deg, rgba(58, 4, 10, .95), rgba(20, 0, 3, .98));
  box-shadow: 0 40px 100px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 185, 58, .06),
    0 0 70px rgba(47, 230, 184, .16);
  animation: panelIn .5s cubic-bezier(.2, .8, .25, 1.35) both, panelGlow 1.8s ease .5s 2;
}

@keyframes panelIn {
  from { opacity: 0; transform: translateY(24px) scale(.9); }
  to { opacity: 1; transform: none; }
}

@keyframes panelGlow {
  0%, 100% { box-shadow: 0 40px 100px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 185, 58, .06), 0 0 70px rgba(47, 230, 184, .16); }
  50% { box-shadow: 0 40px 100px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 185, 58, .12), 0 0 110px rgba(47, 230, 184, .34); }
}

.results-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--gold-line);
  border-radius: 50%;
  background: rgba(30, 0, 4, .5);
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.results-close:hover { color: var(--gold-soft); border-color: var(--gold); }

.results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  padding-right: 30px;
}

.results-head h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 15px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.result-card {
  position: relative;
  overflow: hidden;
  padding: 18px 20px;
  border: 1px solid rgba(220, 74, 0, .5);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(50, 0, 0, .7), rgba(20, 0, 0, .8));
  animation: resultIn .5s cubic-bezier(.2, .8, .25, 1.4) both, hitFlash .9s ease .15s;
}

.result-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: linear-gradient(180deg, var(--teal), var(--gold-soft));
}

.result-card span {
  display: block;
  margin-bottom: 8px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .1em;
}

.result-card strong {
  font-family: var(--mono);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: .015em;
}

.audit {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.7;
  margin-bottom: 16px;
}

.audit .dot { margin: 0 8px; color: var(--gold-line); }
.audit code { color: rgba(255, 255, 255, .78); }

/* ---------- FOOTER ---------- */
.foot {
  margin-top: 26px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .01em;
}

/* ---------- TOAST ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 50;
  transform: translate(-50%, 16px);
  padding: 12px 18px;
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  background: rgba(25, 0, 3, .96);
  color: var(--ink);
  box-shadow: 0 15px 40px rgba(0, 0, 0, .4);
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.hidden { display: none !important; }

@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

@keyframes resultIn {
  from { opacity: 0; transform: translateY(16px) scale(.85); }
  60% { opacity: 1; transform: translateY(-3px) scale(1.04); }
  to { opacity: 1; transform: none; }
}

@keyframes hitFlash {
  0% { box-shadow: 0 0 0 0 rgba(47, 230, 184, 0); }
  35% { box-shadow: 0 0 0 4px rgba(47, 230, 184, .45); }
  100% { box-shadow: 0 0 0 0 rgba(47, 230, 184, 0); }
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .shell { width: min(100% - 20px, 1180px); padding-top: 20px; }
  .top { flex-wrap: wrap; gap: 14px; }
  .logo { width: 130px; }
  .top-right { align-items: flex-start; width: 100%; flex-direction: row; justify-content: space-between; }
  .lang-btn { padding: 7px 11px; font-size: 10px; }
  .local-tag { font-size: 9px; padding: 7px 11px; }
  .panel, .stage, .results { padding: 18px; border-radius: 16px; }
  #idsInput { min-height: 300px; font-size: 16px; }
  .start-label { font-size: 22px; }
  .results-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .result-card strong { font-size: 21px; }
  .ids-foot { flex-wrap: wrap; }
  .results-panel { padding: 22px; max-height: 92vh; }
}

</style>
</head>

<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-target"></div>
    <div class="fx-dart"></div>
    <div class="fx-glow fx-glow-a"></div>
    <div class="fx-glow fx-glow-b"></div>
  </div>

    if (!I18N[nextLang] || nextLang === lang) return;

  function parseIds(text) {
    const tokens = text
      .split(/[\s,;]+/)
      .map(value => value.trim())
      .filter(Boolean);

    const unique = [];
    const seen = new Set();

    for (const token of tokens) {
      if (!seen.has(token)) {
        seen.add(token);
        unique.push(token);
      }
    }

    return {
      ids: unique.slice(0, MAX_IDS),
      duplicates: Math.max(0, tokens.length - unique.length),
      overLimit: unique.length > MAX_IDS
    };
  }

  function canonicalList(ids) {
    return ids.join("\n");
  }

  async function sha256(text) {
    if (!window.crypto?.subtle) {
      return "SHA-256 unavailable";
    }

    const encoded = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", encoded);

    return [...new Uint8Array(digest)]
      .map(byte => byte.toString(16).padStart(2, "0"))
      .join("");
  }

  function shortHash(hash) {
    if (!hash || hash === "—" || hash.length < 16) return hash;
    return `${hash.slice(0, 8)}…${hash.slice(-8)}`;
  }

  function formatNumber(n) {
    return n.toLocaleString("en-US").replace(/,/g, " ");
  }

  function getWinnerCount() {
    const value = Number.parseInt(el.winnerCount.value, 10);
    return Number.isFinite(value) ? value : DEFAULT_WINNERS;
  }

  // Pool = all loaded IDs minus everyone who has already won (auto).
  function getPool() {
    if (state.excludedIds.size === 0) {
      return state.ids;
    }
    return state.ids.filter(id => !state.excludedIds.has(id));
  }

  function setWinnerCount(value) {
    const max = Math.max(1, getPool().length || MAX_IDS);
    const normalized = Math.max(1, Math.min(max, Number(value) || 1));

    el.winnerCount.value = String(normalized);
    validate();
  }

  function updateExcludeInfo() {
    const active = state.excludedIds.size > 0;
    el.excludeInfo.classList.toggle("hidden", !active);
    el.excludeInfoText.textContent = t("excludeInfo", { n: formatNumber(state.excludedIds.size) });
  }

  function validate() {
    const winners = getWinnerCount();
    const pool = getPool();

    let message = "";
    let className = "validation";

    if (state.ids.length === 0) {
      message = t("vAddParticipants");
    } else if (state.overLimit) {
      message = t("vLimit", { max: formatNumber(MAX_IDS) });
      className += " error";
    } else if (pool.length === 0) {
      // Everyone already won — stay quiet, no scary error, just wait for a new list.
      message = t("vAllWon");
    } else if (winners < 1) {
      message = t("vMinOne");
      className += " error";
    } else if (winners > pool.length) {
      message = t("vAvailable", { pool: formatNumber(pool.length) });
      className += " error";
    } else {
      message = t("vReady", { pool: formatNumber(pool.length), winners: formatNumber(winners) });
      className += " ok";
    }

    el.validation.textContent = message;
    el.validation.className = className;

    el.startBtn.disabled =
      state.drawing ||
      pool.length === 0 ||
      winners < 1 ||
      winners > pool.length;

    updateExcludeInfo();
  }

  async function updateIds() {
    const revision = ++state.hashRevision;
    const parsed = parseIds(el.idsInput.value);

    state.ids = parsed.ids;
    state.duplicates = parsed.duplicates;
    state.overLimit = parsed.overLimit;
    state.excludedIds = new Set(); // new list -> nobody has won yet

    el.idCount.textContent = formatNumber(state.ids.length);

    if (!state.ids.length) {
      state.hash = "—";
      el.listHash.textContent = "—";
      validate();
      return;
    }

    el.listHash.textContent = "…";

    const hash = await sha256(canonicalList(state.ids));

    if (revision !== state.hashRevision) {
      return;
    }

    state.hash = hash;
    el.listHash.textContent = shortHash(hash);

    validate();
  }

  /* ---------------- randomness ---------------- */

  function secureRandomIndex(maxExclusive) {
    if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) {
      throw new Error("Invalid random range");
    }

    const RANGE = 0x100000000;
    const limit = Math.floor(RANGE / maxExclusive) * maxExclusive;
    const buffer = new Uint32Array(1);

    let value;

    do {
      crypto.getRandomValues(buffer);
      value = buffer[0];
    } while (value >= limit);

    return value % maxExclusive;
  }

  function pickWithoutReplacement(source, count) {
    const pool = [...source];
    const winners = [];

    for (let i = 0; i < count; i++) {
      const index = secureRandomIndex(pool.length);

      winners.push(pool[index]);

      pool[index] = pool[pool.length - 1];
      pool.pop();
    }

    return winners;
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function animateRoulette(ids) {
    const duration = 2400;
    const startTime = performance.now();

    let iteration = 0;

    while (performance.now() - startTime < duration) {
      const previewId = ids[secureRandomIndex(ids.length)];

      el.rouletteNumber.textContent = previewId;

      const elapsed = performance.now() - startTime;
      const percent = Math.min(99, Math.round((elapsed / duration) * 100));

      el.rouletteProgress.textContent = `${percent}%`;

      iteration += 1;

      const wait = 42 + Math.min(100, iteration * 2.7);

      await delay(wait);
    }

    el.rouletteProgress.textContent = t("progressFinalizing");

    await delay(320);
  }

  function renderResults(winners) {
    el.resultsGrid.replaceChildren();

    winners.forEach((id, index) => {
      const card = document.createElement("article");
      card.className = "result-card";
      card.style.animationDelay = `${Math.min(index, 20) * 55}ms`;

      const label = document.createElement("span");
      label.textContent = String(index + 1).padStart(2, "0");

      const value = document.createElement("strong");
      value.textContent = id;

      card.append(label, value);
      el.resultsGrid.appendChild(card);
    });
  }

  async function startDraw() {
    if (state.drawing) {
      return;
    }

    const winnerCount = getWinnerCount();

    validate();

    if (el.startBtn.disabled) {
      return;
    }

    state.drawing = true;
    validate();

    const drawIds = getPool();
    const drawHash = state.hash;

    el.resultsSection.classList.add("hidden");
    el.drawStage.classList.remove("hidden");

    el.drawStage.scrollIntoView({ behavior: "smooth", block: "center" });

    try {
      await animateRoulette(drawIds);

      const winners = pickWithoutReplacement(drawIds, winnerCount);
      state.winners = winners;

      // Every winner is permanently removed from the pool from now on.
      winners.forEach(id => state.excludedIds.add(id));

      el.drawStage.classList.add("hit");

      if (winners.length === 1) {
        el.rouletteNumber.textContent = winners[0];
      } else {
        el.rouletteNumber.textContent = t("doneLabel");
      }

      el.rouletteProgress.textContent = t("progressDone");

      renderResults(winners);

      const finishedAt = new Date();

      el.drawTime.textContent = finishedAt.toLocaleString(t("localeCode"));
      el.drawParticipants.textContent = formatNumber(drawIds.length);
      el.drawHash.textContent = shortHash(drawHash);

      await delay(400);

      el.resultsSection.classList.remove("hidden");
      spawnConfetti();
    } catch (error) {
      console.error(error);
      showToast(t("genError"));
    } finally {
      state.drawing = false;
      validate();
    }
  }

  /* ---------------- clipboard / toast ---------------- */

  async function copyText(text, successMessage) {
    if (!text || text === "—") {
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
      return;
    } catch (_) {
      const textarea = document.createElement("textarea");

      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();

      showToast(successMessage);
    }
  }

  let toastTimer = null;

  function showToast(message) {
    el.toast.textContent = message;
    el.toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      el.toast.classList.remove("show");
    }, 1900);
  }

  /* ---------------- confetti ---------------- */

  const CONFETTI_COLORS = ["#f0b93a", "#ffe29a", "#ff2b12", "#2fe6b8"];

  function spawnConfetti() {
    el.confettiLayer.replaceChildren();

    const count = 90;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < count; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";

      const left = Math.random() * 100;
      const drift = (Math.random() - 0.5) * 260;
      const duration = 2.6 + Math.random() * 2.0;
      const delay = Math.random() * 0.6;
      const color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      const rounded = Math.random() > 0.5;
      const size = 8 + Math.round(Math.random() * 6);

      piece.style.left = `${left}%`;
      piece.style.width = `${size}px`;
      piece.style.height = `${Math.round(size * 1.6)}px`;
      piece.style.background = color;
      piece.style.setProperty("--drift", `${drift}px`);
      piece.style.animationDuration = `${duration}s`;
      piece.style.animationDelay = `${delay}s`;
      if (rounded) piece.style.borderRadius = "50%";

      fragment.appendChild(piece);
    }

    el.confettiLayer.appendChild(fragment);

    clearTimeout(spawnConfetti._timer);
    spawnConfetti._timer = setTimeout(() => {
      el.confettiLayer.replaceChildren();
    }, 5200);
  }

  function resetDrawView() {
    state.winners = [];

    el.drawStage.classList.add("hidden");
    el.drawStage.classList.remove("hit");
    el.resultsSection.classList.add("hidden");
    el.confettiLayer.replaceChildren();

    el.rouletteNumber.textContent = "--------";
    el.rouletteProgress.textContent = t("progressPreparing");

    validate();

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- events ---------------- */

  el.idsInput.addEventListener("input", updateIds);

  el.clearIdsBtn.addEventListener("click", () => {
    el.idsInput.value = "";
    updateIds();
    el.idsInput.focus();
  });

  el.winnerCount.addEventListener("input", validate);

  el.winnerCount.addEventListener("change", () => {
    setWinnerCount(getWinnerCount());
  });

  el.minusBtn.addEventListener("click", () => {
    setWinnerCount(getWinnerCount() - 1);
  });

  el.plusBtn.addEventListener("click", () => {
    setWinnerCount(getWinnerCount() + 1);
  });

  el.startBtn.addEventListener("click", startDraw);

  el.copyHashBtn.addEventListener("click", () => {
    copyText(state.hash, t("hashCopied"));
  });

  el.copyResultsBtn.addEventListener("click", () => {
    copyText(state.winners.join("\n"), t("listCopied"));
  });

  el.newDrawBtn.addEventListener("click", resetDrawView);
  el.closeResultsBtn.addEventListener("click", resetDrawView);

  el.resultsSection.addEventListener("click", (event) => {
    if (event.target === el.resultsSection) {
      resetDrawView();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !el.resultsSection.classList.contains("hidden")) {
      resetDrawView();
    }
  });

  el.langBtns.forEach(btn => {
    btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
  });

  /* ---------------- init ---------------- */

  el.winnerCount.max = String(MAX_IDS);

  applyStaticTranslations();
  el.rouletteProgress.textContent = t("progressPreparing");
  updateIds();
})();

</script>
</body>
</html>
