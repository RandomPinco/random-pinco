<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b0004">
  <title>PINCO — Tasodifiy tanlov</title>
  <meta name="description" content="PINCO ishtirokchilari uchun halol tasodifiy tanlov.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-target"></div>
    <div class="fx-dart"></div>
    <div class="fx-glow fx-glow-a"></div>
    <div class="fx-glow fx-glow-b"></div>
  </div>

  <main class="shell">
    <header class="top">
      <img src="./pinco-logo.png" alt="PINCO" class="logo">

      <div class="top-right">
        <div class="lang-switch" role="group" aria-label="Til / Язык / Language">
          <button type="button" class="lang-btn" data-lang="uz">UZ</button>
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
          <button type="button" class="lang-btn" data-lang="en">ENG</button>
        </div>
        <div class="local-tag"><i></i><span data-i18n="localTag">brauzeringizda, lokal</span></div>
      </div>
    </header>

    <section class="grid">
      <!-- PARTICIPANTS -->
      <section class="panel panel-ids">
        <div class="panel-head">
          <h1 data-i18n="participantsTitle">Ishtirokchilar</h1>
          <div class="count"><strong id="idCount">0</strong><span>/ 1000</span></div>
        </div>

        <textarea
          id="idsInput"
          rows="16"
          spellcheck="false"
          placeholder="76776459&#10;59304469&#10;79696025&#10;45798645&#10;21087928"
        ></textarea>

        <div class="ids-foot">
          <button id="clearIdsBtn" type="button" class="text-btn" data-i18n="clearBtn">Tozalash</button>
          <button id="copyHashBtn" type="button" class="hash-chip" data-i18n-aria="hashCopyAria" aria-label="Ro'yxat SHA-256 xeshini nusxalash">
            <span>SHA-256</span>
            <code id="listHash">—</code>
          </button>
        </div>
      </section>

      <!-- SETTINGS / START -->
      <section class="panel panel-run">
        <div class="panel-head">
          <h2 data-i18n="winnersTitle">G'oliblar soni</h2>
        </div>

        <div class="stepper">
          <button type="button" id="minusBtn" data-i18n-aria="decreaseAria" aria-label="Kamaytirish">−</button>
          <input id="winnerCount" type="number" min="1" max="1000" value="5" inputmode="numeric">
          <button type="button" id="plusBtn" data-i18n-aria="increaseAria" aria-label="Ko'paytirish">+</button>
        </div>

        <div id="excludeInfo" class="exclude-info hidden">
          <i></i>
          <span id="excludeInfoText"></span>
        </div>

        <div id="validationMessage" class="validation" aria-live="polite"></div>

        <button id="startBtn" type="button" class="start" disabled>
          <span class="start-ring"></span>
          <span class="start-label" data-i18n="startBtn">BOSHLASH</span>
        </button>
      </section>
    </section>

    <!-- DRAW -->
    <section id="drawStage" class="stage hidden">
      <span class="stage-badge"><i></i><span data-i18n="drawBadge">tanlov ketmoqda</span></span>
      <div class="roulette">
        <strong id="rouletteNumber">--------</strong>
        <span id="rouletteProgress"></span>
      </div>
    </section>

    <footer class="foot" data-i18n="footerNote">
      Tanlov butunlay brauzeringizda amalga oshiriladi. Ishtirokchilar ma'lumotlari hech qayerga yuborilmaydi.
    </footer>
  </main>

  <!-- RESULTS OVERLAY -->
  <section id="resultsSection" class="results hidden">
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <div class="results-panel">
      <button id="closeResultsBtn" type="button" class="results-close" data-i18n-aria="closeAria" aria-label="Yopish">×</button>

      <div class="results-head">
        <h2 data-i18n="winnersHeading">G'oliblar</h2>
        <button id="copyResultsBtn" type="button" class="text-btn text-btn-fill" data-i18n="copyResultsBtn">Ro'yxatni nusxalash</button>
      </div>

      <div id="resultsGrid" class="results-grid"></div>

      <div class="audit">
        <span id="drawTime">—</span>
        <span class="dot">·</span>
        <span id="drawParticipants">—</span> <span data-i18n="auditParticipants">ishtirokchi</span>
        <span class="dot">·</span>
        <span data-i18n="auditHashLabel">xesh</span> <code id="drawHash">—</code>
      </div>

      <button id="newDrawBtn" type="button" class="text-btn" data-i18n="newDrawBtn">Yangi tanlov</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
