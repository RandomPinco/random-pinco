<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b0004">
  <title>PINCO — Random Draw</title>
  <meta name="description" content="Честный розыгрыш среди участников PINCO.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="fx" aria-hidden="true">
    <div class="fx-target"></div>
    <div class="fx-dart"></div>
    <div class="fx-glow fx-glow-a"></div>
    <div class="fx-glow fx-glow-b"></div>
  </div>

  <main class="shell">
    <header class="top">
      <img src="./pinco-logo.png" alt="PINCO" class="logo">
      <div class="local-tag"><i></i>локально в браузере</div>
    </header>

    <section class="grid">
      <!-- PARTICIPANTS -->
      <section class="panel panel-ids">
        <div class="panel-head">
          <h1>Участники</h1>
          <div class="count"><strong id="idCount">0</strong><span>/ 1000</span></div>
        </div>

        <textarea
          id="idsInput"
          rows="16"
          spellcheck="false"
          placeholder="76776459&#10;59304469&#10;79696025&#10;45798645&#10;21087928"
        ></textarea>

        <div class="ids-foot">
          <button id="clearIdsBtn" type="button" class="text-btn">Очистить</button>
          <button id="copyHashBtn" type="button" class="hash-chip" aria-label="Скопировать SHA-256 списка">
            <span>SHA-256</span>
            <code id="listHash">—</code>
          </button>
        </div>
      </section>

      <!-- SETTINGS / START -->
      <section class="panel panel-run">
        <div class="panel-head">
          <h2>Победителей</h2>
        </div>

        <div class="stepper">
          <button type="button" id="minusBtn" aria-label="Меньше">−</button>
          <input id="winnerCount" type="number" min="1" max="1000" value="5" inputmode="numeric">
          <button type="button" id="plusBtn" aria-label="Больше">+</button>
        </div>

        <label class="exclude-toggle">
          <input type="checkbox" id="excludeToggle">
          <span class="checkmark"></span>
          <span class="exclude-text">
            Не повторять победителей
            <small id="excludeInfo" class="hidden">разыграно: <strong id="excludedCount">0</strong></small>
          </span>
        </label>

        <div id="validationMessage" class="validation" aria-live="polite">
          Добавьте участников, чтобы начать
        </div>

        <button id="startBtn" type="button" class="start" disabled>
          <span class="start-ring"></span>
          <span class="start-label">START</span>
        </button>
      </section>
    </section>

    <!-- DRAW -->
    <section id="drawStage" class="stage hidden">
      <span class="stage-badge"><i></i>идёт розыгрыш</span>
      <div class="roulette">
        <strong id="rouletteNumber">--------</strong>
        <span id="rouletteProgress">Подготовка…</span>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="resultsSection" class="results hidden">
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

      <div class="results-panel">
        <button id="closeResultsBtn" type="button" class="results-close" aria-label="Закрыть">×</button>

        <div class="results-head">
          <h2>Победители</h2>
          <button id="copyResultsBtn" type="button" class="text-btn text-btn-fill">Копировать список</button>
        </div>

        <div id="resultsGrid" class="results-grid"></div>

        <div class="audit">
          <span id="drawTime">—</span>
          <span class="dot">·</span>
          <span id="drawParticipants">—</span> участников
          <span class="dot">·</span>
          хэш <code id="drawHash">—</code>
        </div>

        <button id="newDrawBtn" type="button" class="text-btn">Новый розыгрыш</button>
        <!-- kept for scripting compatibility, not shown -->
        <span id="drawSummary" class="visually-hidden"></span>
        <span id="drawWinners" class="visually-hidden"></span>
      </div>
    </section>

    <footer class="foot">
      Розыгрыш выполняется локально в вашем браузере. Данные участников никуда не отправляются.
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
